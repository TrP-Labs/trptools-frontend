name: Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # trptools-backend is checked out as a sibling directory because the
      # frontend's devDependency on it (file:../trptools-backend) is how
      # Eden Treaty gets the backend's route types for compile-time checking
      # — the same layout local development uses.
      - uses: actions/checkout@v4
        with:
          path: trptools-frontend
      - uses: actions/checkout@v4
        with:
          repository: TrP-Labs/trptools-backend
          path: trptools-backend

      - uses: oven-sh/setup-bun@v2

      - working-directory: trptools-backend
        run: bun install --frozen-lockfile

      - working-directory: trptools-frontend
        run: bun install --frozen-lockfile

      # `bun run check` compiles the messages, verifies every API error the
      # backend can return has a translation, and type-checks. The backend is
      # already checked out above, which is what makes the error check able to
      # read the literals it compares against.
      - working-directory: trptools-frontend
        run: bun run check

      # The messages in the tree are vendored from TrP-Labs/Locales, so they
      # can fall behind it. Re-pulling and diffing says so on the pull request
      # rather than at the next release. A warning, not a failure: a build must
      # not start depending on GitHub's API being reachable, and translations
      # land on their own schedule.
      - name: Check messages against TrP-Labs/Locales
        working-directory: trptools-frontend
        continue-on-error: true
        run: |
          ./scripts/pull-locales.sh
          if git diff --quiet -- messages; then
            echo "messages are in step with TrP-Labs/Locales."
          else
            echo "::warning::messages/ is behind TrP-Labs/Locales. Run ./scripts/pull-locales.sh and commit."
            git diff --stat -- messages
            git checkout -- messages
          fi

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # A release pushes `main` and the tag together, so two runs of this job
    # start on the same commit seconds apart. Both write the same
    # `type=gha,mode=max` cache scope, and racing on it is what left the second
    # run hanging for tens of minutes with the image already published.
    # Serialising them costs nothing: the one that waits builds against the
    # cache the first has just filled. Not `cancel-in-progress` — the two runs
    # publish different tags (`latest` from main, the version from the tag), so
    # cancelling one would drop tags nobody would notice were missing.
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trp-labs/trptools-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
