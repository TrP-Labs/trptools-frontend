name: Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep main publications ordered, while a tag can wait for its main run.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # trptools-backend is checked out as a sibling directory because the
      # frontend's devDependency on it (file:../trptools-backend) is how
      # Eden Treaty gets the backend's route types for compile-time checking
      # — the same layout local development uses.
      - uses: actions/checkout@v4
        with:
          path: trptools-frontend
      - uses: actions/checkout@v4
        with:
          repository: TrP-Labs/trptools-backend
          path: trptools-backend

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: trptools-frontend/.bun-version

      - working-directory: trptools-backend
        run: bun install --frozen-lockfile

      - working-directory: trptools-frontend
        run: bun install --frozen-lockfile --ignore-scripts

      - working-directory: trptools-frontend
        run: bun run test

      # `bun run check` compiles the messages, verifies every API error the
      # backend can return has a translation, and type-checks. The backend is
      # already checked out above, which is what makes the error check able to
      # read the literals it compares against.
      - working-directory: trptools-frontend
        run: bun run check

      - uses: docker/setup-buildx-action@v3
        if: github.ref_type != 'tag'

      # Validate the packaged application before publication. The next job
      # reuses this native compilation from the cache for both architectures.
      - uses: docker/build-push-action@v6
        if: github.ref_type != 'tag'
        with:
          context: trptools-frontend
          load: true
          tags: trptools-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Test the production container in Chromium
        if: github.ref_type != 'tag'
        working-directory: trptools-frontend
        run: bun run test:runtime trptools-frontend:test

      # The messages in the tree are vendored from TrP-Labs/Locales, so they
      # can fall behind it. Re-pulling and diffing says so on the pull request
      # rather than at the next release. A warning, not a failure: a build must
      # not start depending on GitHub's API being reachable, and translations
      # land on their own schedule.
      - name: Check messages against TrP-Labs/Locales
        working-directory: trptools-frontend
        continue-on-error: true
        run: |
          ./scripts/pull-locales.sh
          if git diff --quiet -- messages; then
            echo "messages are in step with TrP-Labs/Locales."
          else
            echo "::warning::messages/ is behind TrP-Labs/Locales. Run ./scripts/pull-locales.sh and commit."
            git diff --stat -- messages
            git checkout -- messages
          fi

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trp-labs/trptools-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  promote:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trp-labs/trptools-frontend
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      # release.sh still observes separate main and tag workflow runs, but
      # the tag copies the successful main image's index, without rebuilding.
      - name: Promote the matching main image by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bun scripts/promote-image.ts
